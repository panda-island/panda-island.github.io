<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f0e8"><meta name="description" content="有一份東西，只能由你本人簽收。"><title>有你的神祕包裹 📦</title>
<style>
:root{--paper:#f1f0e8;--ink:#25271f;--green:#d7fa72;--muted:#77796e;--line:#d7d8cc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #7963ce;outline-offset:5px}button:disabled{cursor:default}main{max-width:480px;min-height:100svh;margin:auto;padding: max(22px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;font:11px ui-monospace,monospace;letter-spacing:1px;padding-bottom:20px;border-bottom:1px solid var(--line)}.status{display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:#698d2c}.stage{flex:1;display:flex;flex-direction:column;padding-top:32px;animation:enter .5s ease both}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:18px}h1{font-size:clamp(37px,10vw,48px);letter-spacing:-2px;line-height:1.2;margin:0;font-weight:850}h1 em{font-style:normal;background:var(--green);padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}p{font-size:15px;line-height:1.85;color:#6b6e62;margin:20px 0} .hero-art{position:relative;height:212px;display:grid;place-items:center;margin:16px 0}.orbit{position:absolute;width:207px;height:207px;border:1px dashed #bbc2a6;border-radius:50%;transform:rotate(-18deg)}.orbit:after{content:'✦';position:absolute;font-size:30px;right:4px;top:12px;background:var(--paper);color:#7b8a55}.parcel{width:158px;height:119px;background:#d5b58a;border:2px solid var(--ink);border-radius:4px;transform:rotate(-9deg);box-shadow:7px 8px 0 #25271f12;position:relative}.parcel:before{content:'';position:absolute;left:60px;width:30px;height:100%;background:#f5e1b6;border-left:1px solid #25271f66;border-right:1px solid #25271f66}.parcel:after{content:'?';position:absolute;background:var(--green);border:2px solid var(--ink);border-radius:50%;width:57px;height:57px;right:-18px;top:-20px;text-align:center;font-size:42px;font-weight:800;transform:rotate(20deg)}.label{position:absolute;left:10px;bottom:14px;background:#faf8ed;padding:8px 9px;font:10px monospace;line-height:1.6;transform:rotate(2deg);border:1px solid #25271f}.label span{letter-spacing:2px}.stamp{position:absolute;right:0;bottom:10px;background:var(--green);padding:8px 11px;font:10px monospace;transform:rotate(8deg);border:1px solid var(--ink)}.ticket{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;font-size:12px;margin:0 0 24px}.ticket span{color:var(--muted)}.primary{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:60px;border:1.5px solid var(--ink);border-radius:14px;background:var(--green);color:var(--ink);padding:16px 20px;font-weight:700;box-shadow:0 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.arrow{font-size:23px;font-weight:400}.fine{font-size:11px;text-align:center;color:var(--muted);line-height:1.6;margin:16px 0}.footer{display:flex;justify-content:space-between;align-items:center;padding-top:22px;margin-top:auto;font:10px ui-monospace,monospace;color:var(--muted);letter-spacing:1px}.footer button{border:0;background:none;color:var(--muted);font-size:11px;padding:10px}.badge{display:inline-block;align-self:flex-start;background:#e4e6db;border-radius:30px;padding:8px 12px;font:11px monospace;margin-bottom:25px}.arena{height:240px;position:relative;border:1px dashed #b7bdab;border-radius:20px;margin:20px 0 0;display:grid;place-items:center;background:#e9ecdf}.arena .primary{position:absolute;width:170px;min-height:54px;transition:left .18s,top .18s;left:calc(50% - 85px);top:93px}.arena:before{content:'本人簽收區';position:absolute;top:14px;left:15px;font-size:11px;color:#848b75;letter-spacing:2px}.feedback{min-height:52px;font-size:14px;text-align:center;margin:15px 0;color:#66733c}.option{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:#fafaf5;border:1px solid #cdd1bf;border-radius:14px;padding:18px;margin:11px 0;font-weight:600;font-size:15px}.option b{display:grid;place-items:center;width:28px;height:28px;border:1px solid #c8cbbd;border-radius:50%;font:12px monospace}.option:active{background:var(--green)}.meter{height:16px;background:#dde0d1;border:1px solid var(--ink);border-radius:30px;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .15s}.percent{font:800 92px ui-monospace,monospace;letter-spacing:-8px;margin:42px 0 24px}.percent small{font-size:30px;letter-spacing:0}.log{font:12px ui-monospace,monospace;line-height:2.2;color:var(--muted);margin:22px 0}.notice{margin:24px 0;border:1px solid var(--ink);padding:22px;background:var(--green);border-radius:16px}.notice strong{font-size:22px}.notice p{margin:9px 0 0;color:#505b33;font-size:14px}.big-icon{font-size:65px;margin:26px 0}.birthday{background:#e9e3f5}.birthday header{border-color:#ccc3dd}.birthday .eyebrow{color:#7a6594}.birthday h1{font-size:56px;letter-spacing:-2.5px}.birthday h1 em{background:#d7fa72}.cake-wrap{margin:8px auto 0;position:relative;width:250px;height:229px}.cake{position:absolute;width:190px;height:97px;bottom:22px;left:30px;background:#dfb0bc;border:2px solid var(--ink);border-radius:11px 11px 20px 20px;box-shadow:inset 0 -23px #cf96a7}.icing{position:absolute;top:-2px;left:-2px;width:190px;height:27px;border:2px solid var(--ink);border-radius:12px 12px 50% 50%;background:#fff9e9}.cake:after{content:'HAPPY BIRTHDAY';position:absolute;left:0;right:0;text-align:center;top:43px;font:10px monospace;letter-spacing:1px;color:#5b3546}.plate{position:absolute;bottom:14px;left:15px;width:220px;height:18px;border:2px solid var(--ink);border-radius:50%;background:#f8f6ed}.candle{position:absolute;left:115px;top:56px;height:60px;width:19px;padding:0;border:2px solid var(--ink);border-radius:3px;background:repeating-linear-gradient(135deg,#d7fa72 0 8px,#a5c05d 8px 15px);z-index:2}.candle:before{content:'';position:absolute;width:20px;height:29px;top:-35px;left:-3px;background:#ffb950;border:2px solid var(--ink);border-radius:80% 20% 60% 40%;transform:rotate(-20deg);animation:flame .8s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ffc26f)}.candle.out:before{background:none;border:0;animation:none;content:'✧';color:#897894;font-size:29px;top:-42px;transform:none}.spark{position:absolute;font-size:30px;left:8px;top:40px}.spark.two{left:auto;right:5px;top:90px;font-size:22px}.letter{padding:24px;background:#faf8f0;border:1px solid #c9bed6;border-radius:3px;box-shadow:5px 5px 0 #d8cde5;margin:22px 0 28px;transform:rotate(-1deg)}.letter .dear{font-weight:700;font-size:18px}.letter p{font-size:14px;color:#655d6d;margin:15px 0;line-height:2}.timeline{display:flex;justify-content:space-between;margin:20px 0 25px;position:relative;font-size:12px;color:#776785}.timeline:before{content:'';height:1px;background:#c6b8d7;position:absolute;top:6px;left:12%;right:12%}.timeline span{z-index:1;text-align:center}.timeline span:before{content:'';display:block;width:13px;height:13px;background:#e9e3f5;border:1px solid #a18aaf;border-radius:50%;margin:0 auto 10px}.timeline span:last-child:before{background:var(--green)}.signature{text-align:right;font-size:12px;color:#83728c}.confetti{position:fixed;top:-20px;width:9px;height:15px;pointer-events:none;z-index:10;animation:fall 3s ease-in forwards}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes enter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes flame{to{transform:rotate(-8deg) scale(.9)}}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(690deg);opacity:.3}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;scroll-behavior:auto!important;transition:none!important}.confetti{display:none}}@media(min-width:600px){body{padding:25px 0;background:#dcded2}main{min-height:calc(100svh - 50px);border:1px solid #c5c7ba;border-radius:26px;background:var(--paper);box-shadow:0 20px 80px #25271f18}main.birthday{background:#e9e3f5}}@media(max-height:740px){.hero-art{height:180px;margin:8px 0}.orbit{height:175px;width:175px}.stage{padding-top:24px}}
</style></head><body><main id="app"><header><span>SECRET DELIVERY / 1017</span><span class="status"><i class="dot"></i>待本人簽收</span></header><section class="stage" id="stage" aria-live="polite"></section><footer class="footer"><span id="foot">FOR YOUR EYES ONLY</span><button id="skip" hidden>直接看結果 ↗</button></footer></main>
<script>
const $=s=>document.querySelector(s);let timers=[],dodges=0,soundOn=false,audio;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}function clear(){timers.forEach(clearTimeout);timers=[]}function render(html){clear();$('#stage').innerHTML=html;window.scrollTo(0,0)}function bind(id,fn){$(id).addEventListener('click',fn)}function buzz(){if(navigator.vibrate)navigator.vibrate(25)}
function intro(){ $('#app').classList.remove('birthday');$('#skip').hidden=true;render(`<div class="eyebrow">YOU HAVE A MYSTERY PACKAGE</div><h1>欸，等一下。<br>這個<em>只能你開。</em></h1><p>有人寄了一份東西給你。<br>寄件人說：你看了就知道是誰。</p><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="parcel"><div class="label">TO：你本人<br><span>▌▌▌▌▌▌▌▌</span></div></div><div class="stamp">10.17 限定派送</div></div><div class="ticket"><span>寄件人</span><strong>一位認識你很久的人</strong></div><button class="primary" id="open">好，我來簽收 <span class="arrow">↗</span></button><div class="fine">請本人操作。旁邊的人先不要偷看。</div>`);bind('#open',verify)}
function verify(){dodges=0;$('#skip').hidden=false;render(`<span class="badge">01 / 身分確認</span><h1>先確認，<br>你是<em>你本人。</em></h1><p>非常簡單。<br>點一下下面的按鈕就好，真的。</p><div class="arena"><button id="catch" class="primary">我是本人 <span>→</span></button></div><p class="feedback" id="feedback">準備好了？</p><div class="fine">認識這麼久，還是想測一下你的反應。</div>`);bind('#catch',()=>{buzz();dodges++;if(dodges<=3){const positions=[[12,20],[-12,158],[10,89]];const [x,y]=positions[dodges-1];$('#catch').style.left=x<0?'calc(100% - 182px)':x+'px';$('#catch').style.top=y+'px';$('#feedback').textContent=['欸？它好像不想讓你按。','差一點！再來一次？','好啦不跑了，這次真的可以。'][dodges-1]}else quiz()})}
function quiz(){render(`<span class="badge">02 / 友情驗證</span><h1>回答一題，<br>證明你<em>夠熟。</em></h1><p>我們從幼兒園認識到高中，<br>這段交情應該怎麼形容？</p><button class="option" id="a"><b>A</b>孽緣，想甩都甩不掉。</button><button class="option" id="b"><b>B</b>從小就很有眼光，懂交朋友。</button><button class="option" id="c"><b>C</b>都認識那麼久了，還要考？</button><div class="feedback" id="answer"></div>`);['a','b','c'].forEach(id=>bind('#'+id,()=>{document.querySelectorAll('.option').forEach(x=>x.disabled=true);$('#answer').textContent={a:'孽緣認證成功。這輩子先別想退貨。',b:'有眼光這點，我完全同意。',c:'好好好，你說了算。老朋友通關！'}[id];later(handsome,1500)}))}
function handsome(){let escapes=0,accepted=false;render(`<span class="badge">03 / 誠實大考驗</span><h1>最後一題。<br>我是不是<em>大帥哥？</em></h1><p>從幼兒園認識到高中，<br>這麼明顯的事，應該不用想吧。</p><button class="primary" id="admit">好啦，你是大帥哥 <span class="arrow">✓</span></button><div class="arena" style="height:190px"><button id="deny" class="primary" style="top:70px;background:#fafaf5">我才不承認 <span>×</span></button></div><div class="feedback" id="honest">請憑良心作答。系統非常公正。</div><div class="fine">本關由大帥哥本人提供技術支援。</div>`);$('.arena').style.position='relative';function admit(){if(accepted)return;accepted=true;$('#admit').disabled=true;$('#deny').disabled=true;$('#admit').innerHTML='大帥哥認證成功 <span>✓</span>';$('#honest').textContent='很好，有眼光。你的生日包裹批准放行。';buzz();later(loading,1700)}function escape(e){if(accepted)return;e.preventDefault();if(escapes>=4){admit();return}escapes++;const b=$('#deny');b.style.left=escapes%2?'12px':'calc(100% - 182px)';b.style.top=escapes%2?'116px':'18px';$('#honest').textContent=['欸，這個選項好像不太同意你。','不要嘴硬，誠實一點。','認識這麼久了，給個面子吧。','系統已修正你的答案。不客氣。'][escapes-1];if(escapes===4){b.innerHTML='行，你是大帥哥 ✓';b.style.fontSize='13px'}buzz()}bind('#admit',admit);$('#deny').addEventListener('pointerdown',escape);$('#deny').addEventListener('click',e=>{if(e.detail===0)escape(e)})}
function loading(){render(`<span class="badge">04 / 正在拆封</span><h1>你的包裹，<br><em>馬上就好。</em></h1><div class="percent"><span id="pct">0</span><small>%</small></div><div class="meter" role="progressbar" aria-label="拆封進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" style="width:0%"></div></div><div class="log" id="log">✓ 本人確認完成<br>✓ 友情驗證通過<br>↳ 正在讀取神祕內容…</div><p id="wait">這次真的沒有在整你。</p>`);let n=0;function tick(){n=Math.min(99,n+7+Math.floor(Math.random()*12));$('#pct').textContent=n;$('.fill').style.width=n+'%';$('.meter').setAttribute('aria-valuenow',n);if(n<99)later(tick,180);else{later(()=>$('#wait').textContent='……怎麼卡住了？',1000);later(()=>$('#wait').textContent='好啦，99% 是故意的。',2400);later(prank,3800)}}later(tick,250)}
function prank(){render(`<span class="badge">系統有話要說</span><div class="big-icon" aria-hidden="true">🫵</div><h1>你是不是<br>真的<em>相信了？</em></h1><div class="notice"><strong>包裹不存在。</strong><p>會跑的按鈕、帥哥認證、卡住的進度條，全部都是安排好的。</p></div><p>誰叫我們認識這麼久了，<br>今天還是想鬧你一下。<br>不鬧了，重點只有一句。</p><button class="primary" id="truth">好啦，到底要說什麼 <span class="arrow">↗</span></button>`);bind('#truth',birthday)}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<58;i++){const c=document.createElement('i');c.className='confetti';c.style.cssText=`left:${Math.random()*100}%;background:${['#c8ea6b','#b8a0d9','#e8a2b7','#ffcb75'][i%4]};--dx:${Math.random()*160-80}px;animation-delay:${Math.random()*.65}s;`;document.body.append(c);setTimeout(()=>c.remove(),4200)}}
function melody(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=[261.63,261.63,293.66,261.63,349.23,329.63,261.63,261.63,293.66,261.63,392,349.23];notes.forEach((n,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.23;o.type='sine';o.frequency.value=n;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.21);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.23)})}catch{}}
function birthday(){render(`<div class="eyebrow">THE REAL MESSAGE / OCTOBER 17</div><h1>老朋友，<br><em>生日快樂！</em></h1><p style="margin-bottom:0">生日一年一次，整你也是必要流程。</p><div class="cake-wrap"><span class="spark">✧</span><span class="spark two">✦</span><div class="plate"></div><div class="cake"><div class="icing"></div></div><button class="candle" id="candle" aria-label="點一下吹熄生日蠟燭"></button></div><div class="fine" id="wish" style="margin-top:0">許個願再點蠟燭，願望不要太離譜。</div><div class="timeline"><span>幼兒園</span><span>國小</span><span>國中</span><span>高中</span></div><article class="letter"><div class="dear">欸，壽星，生日快樂！</div><p>從幼兒園認識到高中，<br>客套話就省了，祝福直接上：</p><p>恭喜又老一歲<br>不要交到男朋友<br>多睡覺<br>餒餒變大<br>成年了要跟我分享故事</p><p><strong>最後，最重要的一句：<br>我永遠是大帥哥。</strong></p><div class="signature">— 你的青梅竹馬（兼大帥哥）</div></article><button class="primary" id="celebrate">再撒一次彩帶 <span class="arrow">✦</span></button><div class="fine">10 月 17 日，今天你最大。</div>`);$('#app').classList.add('birthday');$('.status').innerHTML='<i class="dot"></i>祝福已送達';$('#skip').hidden=true;$('#foot').textContent='ANOTHER YEAR. SAME NONSENSE.';confetti();bind('#candle',()=>{if($('#candle').classList.contains('out'))return;$('#candle').classList.add('out');$('#candle').setAttribute('aria-label','蠟燭已吹熄，願望已收到');$('#wish').textContent='願望收到了。能不能實現我不知道，蛋糕先吃。';confetti();melody();buzz()});bind('#celebrate',confetti)}
bind('#skip',birthday);intro();
</script></body></html>
